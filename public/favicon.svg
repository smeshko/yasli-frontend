<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ясли Варна">
  <!-- Дворът brand mark: a riso dot with its ink misregistration offset.
       Deliberately typeface-free: an SVG favicon cannot rely on a self-hosted
       webfont, and the mark this replaces set its letter in a font we no
       longer ship. -->
  <rect width="64" height="64" rx="14" fill="#f4ecdf"/>
  <circle cx="35" cy="35" r="17" fill="#201c17"/>
  <circle cx="31" cy="31" r="17" fill="#c7361f"/>
  <circle cx="25" cy="25" r="4.5" fill="#f4ecdf"/>
</svg>
